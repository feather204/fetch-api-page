<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Card Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>MTG Card Search</h1>
        <div id="search">
            <input type="text" id="searchBox" placeholder="Enter card name (ex. Lightning Bolt)">
            <select id="colorFilter">
                <option value="">All Colors</option>
                <option value="W">White</option>
                <option value="G">Green</option>
                <option value="U">Blue</option>
                <option value="R">Red</option>
                <option value="B">Black</option>
                <option value="C">Colorless</option>
            </select>
            <button type="button" id="searchButton" onClick="fetchData()">Search</button>
            <button type="button" id="clearButton" onClick="clearResults()">Clear</button>
        </div>
    </header>

    <main>
        <section id="result-section">
            <h2>Results</h2>
            <div id="results"></div>
        </section>
    </main>

    <footer>
        <p>Magic: The Gathering is owned by Wizards of the Coast.</p>
        <p>Card data pulled from the <a href="https://scryfall.com/docs/api">Scryfall</a> API.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
